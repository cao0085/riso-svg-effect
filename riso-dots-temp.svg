<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <!-- ============================================================
       可丟棄底色:tone-on-tone 時直接刪掉這一行(或改成你的紙色)。
       刪掉後背景透明,你的 render 想鋪什麼紙底都行。
       ============================================================ -->
  <rect id="bg" width="80" height="80" fill="#f3eccf"/>

  <!-- ============================================================
       圖案層:全部吃 currentColor。
       外層 CSS 設 color: #xxx 就整片換色,單色 tone-on-tone。
       沒設 color 時預設為黑,方便單獨開檔預覽。
       這是 80×80 的無縫磁磚,所有壓邊的點都已在對邊複製,
       平鋪不會出現接縫,也沒有任何 translate 錯位。
       ============================================================ -->
  <g fill="currentColor">
    <!-- 主結構:半錯位(brick)大點 r=6,壓邊處對邊成對 -->
    <circle cx="0"  cy="0"  r="6"/>
    <circle cx="40" cy="0"  r="6"/>
    <circle cx="80" cy="0"  r="6"/>
    <circle cx="20" cy="40" r="6"/>
    <circle cx="60" cy="40" r="6"/>
    <circle cx="0"  cy="80" r="6"/>
    <circle cx="40" cy="80" r="6"/>
    <circle cx="80" cy="80" r="6"/>

    <!-- 中點 + 邊中點:中號點 r≈3.3,補洞、做出半色調層次 -->
    <circle cx="40" cy="40" r="3.6"/>
    <circle cx="0"  cy="40" r="3.2"/>
    <circle cx="80" cy="40" r="3.2"/>

    <!-- 散點:小 r=1.5,刻意的 halftone 飛沫,全在內側不壓邊 -->
    <circle cx="12" cy="18" r="1.5"/>
    <circle cx="68" cy="18" r="1.5"/>
    <circle cx="12" cy="62" r="1.5"/>
    <circle cx="68" cy="62" r="1.5"/>
    <circle cx="34" cy="58" r="1.5"/>
    <circle cx="46" cy="22" r="1.5"/>
  </g>
</svg>
